<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Gadget Store</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
<h2>Cyber Gadget</h2>
</header>

<div class="product-container">

<img src="images/product.png" class="product-img">

<h2 class="product-title">
Portable Electronics Multi-Tool
</h2>

<div class="price">

<span class="old">₹999</span>
<span class="new">₹699</span>

</div>

<p class="shipping">Free Shipping</p>
<p class="return">14 Days Return Policy</p>

<div class="pincode">

<input id="pin" placeholder="Enter Pincode">
<button onclick="checkPin()">Check</button>

</div>

<p id="pinmsg"></p>

<div class="btns">

<button class="cart">Add to Cart</button>

<button class="buy" onclick="buyNow()">
Buy Now
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
