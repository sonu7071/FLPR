<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cyber Gadget Store</title>

<link rel="stylesheet" href="style.css">

<script src="script.js"></script>

</head>

<body>

<header class="header">

<div class="logo">
Cyber Gadget Store
</div>

</header>


<div class="product">

<div class="slider">

<img id="slide"
src="images/FLIPPER IN HAND.png">

</div>


<h2 class="title">

Portable Electronics Multi-Tool

</h2>


<div class="pricebox">

<span class="old">₹999</span>

<span class="new">₹699</span>

<span class="off">30% OFF</span>

</div>


<div class="badges">

<span>🚚 Free Shipping</span>

<span>🔄 14 Day Return</span>

<span>🔒 Secure Order</span>

</div>


<div class="pincode">

<input id="pin"
placeholder="Enter Pincode">

<button onclick="checkPin()">

Check

</button>

</div>

<p id="pinmsg"></p>


<div class="buttons">

<button class="cart">

Add to Cart

</button>

<button class="buy"
onclick="buyNow()">

Buy Now

</button>

</div>

</div>


<div class="gallery">

<img src="images/DEVICE IMAGE WIT SPECIFICATION.png">

<img src="images/CONNECT IMAGE.png">

<img src="images/HACKING TV AC.jpg">

<img src="images/UNLOCKING DOOR.jpg">

<img src="images/IMAGE CONFIG.png">

<img src="images/PACKAGE CONTAIN IMAGE.png">

</div>


<div class="sticky">

<button onclick="buyNow()">

Buy Now ₹699

</button>

</div>


</body>

</html>
